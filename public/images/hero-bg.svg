  <circle cx="1200" cy="150" r="200" fill="#FFD700" opacity="0.08"/>
  <circle cx="200" cy="700" r="150" fill="#1E90FF" opacity="0.08"/>
  <circle cx="700" cy="450" r="250" fill="#DC143C" opacity="0.05"/>
  <text x="720" y="480" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" opacity="0.3" text-anchor="middle" font-weight="bold">HERO BACKGROUND</text>
  <text x="720" y="520" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.2" text-anchor="middle">✋ Ganti dengan foto asli sekolah</text>
